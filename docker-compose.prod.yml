# Unitik-Cob — producción (servidor local UNITIK, Cumbitara)
# Uso: docker compose -f docker-compose.prod.yml up -d
# Requiere archivo .env con credenciales reales (nunca en el repo).
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: America/Bogota
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DEVICE_SECRET_KEY: ${DEVICE_SECRET_KEY}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

  # Backup diario de PostgreSQL a las 02:00 hora Colombia
  # (política de continuidad del servicio — ISO/IEC 38500: Estrategia)
  backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Bogota
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        sleep_until_2am=$$(( ( $$(date -d "02:00 tomorrow" +%s 2>/dev/null || date +%s) - $$(date +%s) + 86400 ) % 86400 ));
        sleep $$sleep_until_2am;
        pg_dump -h postgres -U ${POSTGRES_USER} ${POSTGRES_DB} > /backups/unitik_$$(date +%Y%m%d_%H%M%S).sql;
        find /backups -name "unitik_*.sql" -mtime +14 -delete;
      done'

volumes:
  postgres_data:
  redis_data:
