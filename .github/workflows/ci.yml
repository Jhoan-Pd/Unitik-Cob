name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unitik
          POSTGRES_PASSWORD: unitik_test
          POSTGRES_DB: unitik_cob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unitik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://unitik:unitik_test@localhost:5432/unitik_cob_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TZ: America/Bogota

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @unitik/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations (cold start check)
        run: pnpm --filter @unitik/api prisma:deploy

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
